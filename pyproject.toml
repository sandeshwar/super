[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "super-harness"
version = "1.0.0"
description = "SUPER production coding harness: gated, provenanced, risk-calibrated agent runtime"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
super = "super.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["super*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
